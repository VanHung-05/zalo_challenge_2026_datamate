llm:
  backend: ollama
  model: "qwen2.5:7b"
  ollama_url: "http://localhost:11434"
  num_ctx: 32768          # prompt = rulebook + README + schema (~10-20k tokens); Ollama default would truncate it
  request_timeout: 300
  seed: 42
  temperature: 0.0
  max_tokens: 1024

agent:
  mode: sql               # sql: LLM writes DuckDB SQL | pandas: LLM writes pandas code (legacy)
  pipeline: v2            # v2: Business Card + semantic layer + fast path + Guard + calibrated decision | v1: single-shot SQL
  n_samples: 1
  max_retries: 3          # repairs of the final program (traceback sent back)
  sandbox_timeout: 30     # seconds per SQL query / pandas execution
  sql_threads: 1          # DuckDB threads; 1 keeps results reproducible (Rule 8)
  on_llm_unanswerable: unanswerable   # unanswerable | abstain (what to submit when the LLM says unanswerable)
  sample_temperature: 0.7  # self-consistency samples 2..n (sample 1 is greedy); seed = llm.seed + i
  synthesis: python        # python: LLM writes pandas code (code_agent.py) | sql: LLM writes DuckDB SQL (sql_agent.py)
  max_explore: 2           # exploration programs per sample (printed output is sent back)
  fast_path: false         # false: answers come only from the LLM (sl_* tables + Guard stay on); true: deterministic intents first
  llm_verify_fast_path: false  # also run the LLM when the fast path answered

runner:
  time_budget_seconds: 18000   # global watchdog: questions after this are abstain (limit is 6 h)
  question_timeout_seconds: 150  # per question: no new LLM sample after this
  cache_dir: outputs/cache  # Business Cards (dev); prod uses /tmp (never written under /data)
  parallel_workers: 1
  group_by_business: true
  data_dir: "train"
  output_file: "submission.jsonl"

decision:                  # plan §1.2 / §4.7
  tau: 0.7                 # answer a value only if P(correct) >= tau
  tau_unanswerable: 0.8    # answer "unanswerable" only if P(unanswerable) >= this
  p_unanswerable_out_of_coverage: 0.85  # period outside a coverage that agrees with the README (rulebook §7)
  p_unanswerable_capability: 0.5        # semantic layer found no column for it (often our detection failure)
  p_unanswerable_llm_unanimous: 0.6  # every LLM sample said unanswerable (weak on its own)
  min_sales_confidence: 0.4          # below: fast-path answers are vetoed (low_confidence_role)
  fast_path_priors: configs/fast_path_priors.json   # per-intent precision (scripts/eval_fast_path.py --priors-out)
  guard_weights: null      # scripts/train_guard.py --save PATH
  calibrator: null         # scripts/train_calibrator.py --save PATH
